<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#2b0a53"/>
  <circle cx="1120" cy="70" r="260" fill="#b99cff" opacity="0.09"/>
  <circle cx="110" cy="760" r="240" fill="#dbccff" opacity="0.06"/>

  <g transform="translate(80 80)">
    <rect width="72" height="72" rx="18" fill="#4d1380" stroke="#a984ff" stroke-opacity="0.45"/>
    <text x="36" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="43" font-weight="700">M</text>
    <text x="94" y="30" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">Meetily</text>
    <text x="94" y="57" fill="#d9c8ff" font-family="Arial" font-size="17">Google Meet Reminder</text>
  </g>

  <g transform="translate(80 230)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial" font-size="57" font-weight="700">Never forget to</text>
    <text x="0" y="66" fill="#ffffff" font-family="Arial" font-size="57" font-weight="700">start recording.</text>
    <text x="0" y="165" fill="#e4d9ff" font-family="Arial" font-size="23">Join Google Meet. Get a local reminder.</text>
    <text x="0" y="199" fill="#e4d9ff" font-family="Arial" font-size="23">You stay in control.</text>

    <g transform="translate(0 260)">
      <g>
        <circle cx="16" cy="16" r="16" fill="#a984ff"/>
        <text x="16" y="22" text-anchor="middle" fill="#1b0637" font-family="Arial" font-size="18" font-weight="800">1</text>
        <text x="48" y="23" fill="#ffffff" font-family="Arial" font-size="20" font-weight="650">Join your call</text>
      </g>
      <g transform="translate(0 62)">
        <circle cx="16" cy="16" r="16" fill="#a984ff"/>
        <text x="16" y="22" text-anchor="middle" fill="#1b0637" font-family="Arial" font-size="18" font-weight="800">2</text>
        <text x="48" y="23" fill="#ffffff" font-family="Arial" font-size="20" font-weight="650">Choose Start recording</text>
      </g>
      <g transform="translate(0 124)">
        <circle cx="16" cy="16" r="16" fill="#a984ff"/>
        <text x="16" y="22" text-anchor="middle" fill="#1b0637" font-family="Arial" font-size="18" font-weight="800">3</text>
        <text x="48" y="23" fill="#ffffff" font-family="Arial" font-size="20" font-weight="650">Meetily records locally</text>
      </g>
    </g>
  </g>

  <g transform="translate(585 118)">
    <rect width="615" height="536" rx="28" fill="#f8f7fb"/>
    <rect width="615" height="54" rx="28" fill="#ece9f2"/>
    <rect y="27" width="615" height="27" fill="#ece9f2"/>
    <circle cx="25" cy="27" r="7" fill="#ff655f"/>
    <circle cx="49" cy="27" r="7" fill="#ffc04b"/>
    <circle cx="73" cy="27" r="7" fill="#35c759"/>
    <text x="307" y="34" text-anchor="middle" fill="#60596b" font-family="Arial" font-size="14" font-weight="650">Meetily · Settings</text>

    <g transform="translate(42 94)">
      <text x="0" y="0" fill="#17131d" font-family="Arial" font-size="27" font-weight="750">Google Meet reminder</text>
      <text x="0" y="34" fill="#6b6573" font-family="Arial" font-size="15">Remind me when a Google Meet call starts in Chrome.</text>
      <rect x="0" y="67" width="128" height="34" rx="17" fill="#e7f8ee"/>
      <circle cx="17" cy="84" r="5" fill="#16834a"/>
      <text x="31" y="90" fill="#146c40" font-family="Arial" font-size="14" font-weight="700">Connected</text>
    </g>

    <g transform="translate(76 270)">
      <rect width="463" height="184" rx="22" fill="#ffffff" stroke="#ded9e7"/>
      <rect x="24" y="24" width="48" height="48" rx="13" fill="#4d1380"/>
      <text x="48" y="59" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="29" font-weight="700">M</text>
      <text x="88" y="43" fill="#17131d" font-family="Arial" font-size="18" font-weight="750">Google Meet is in progress</text>
      <text x="88" y="67" fill="#6b6573" font-family="Arial" font-size="14">Would you like Meetily to record this call?</text>

      <rect x="24" y="112" width="178" height="46" rx="11" fill="#35105f"/>
      <circle cx="48" cy="135" r="6" fill="#ff5d74"/>
      <text x="64" y="141" fill="#ffffff" font-family="Arial" font-size="15" font-weight="700">Start recording</text>
      <rect x="214" y="112" width="132" height="46" rx="11" fill="#f5f3f8" stroke="#ddd8e6"/>
      <text x="280" y="141" text-anchor="middle" fill="#514a59" font-family="Arial" font-size="15" font-weight="650">Skip this call</text>
    </g>
  </g>

  <g transform="translate(80 742)">
    <path d="M0 0 H1120" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="0" y="34" fill="#d9c8ff" font-family="Arial" font-size="14">No meeting content leaves your computer.</text>
    <text x="1120" y="34" text-anchor="end" fill="#d9c8ff" font-family="Arial" font-size="14">Meetily for macOS required</text>
  </g>
</svg>
