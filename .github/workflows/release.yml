name: "Release"

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version consistency
        run: ./scripts/check-version-consistency.sh

      - name: Validate updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/check-updater-signing-secrets.sh

      - name: Validate release version and tag
        id: get-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use strict X.Y.Z format; got: $VERSION" >&2
            exit 1
          fi

          git fetch --tags
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Release tag v${VERSION} already exists. Bump the application version first." >&2
            exit 1
          fi

          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `Meetily v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            console.log(`Created draft release with ID: ${data.id}`)
            return data.id

  build-macos-apple-silicon:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-14"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin"
      sign-binaries: false
      asset-prefix: "meetily"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  verify-and-publish:
    needs: [create-release, build-macos-apple-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify draft release assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          EXPECTED_VERSION: ${{ needs.create-release.outputs.version }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID)
            const expectedVersion = process.env.EXPECTED_VERSION
            const owner = context.repo.owner
            const repo = context.repo.repo

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId
            })
            if (!release.draft) {
              throw new Error('Release must remain a draft until verification succeeds')
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100
            })
            const requiredAssets = [
              { label: 'DMG', matches: name => name.endsWith('.dmg') },
              { label: 'updater archive', matches: name => name.endsWith('.app.tar.gz') },
              { label: 'updater signature', matches: name => name.endsWith('.app.tar.gz.sig') },
              { label: 'updater manifest', matches: name => name === 'latest.json' }
            ]
            const missingAssets = requiredAssets
              .filter(required => !assets.some(asset => required.matches(asset.name)))
              .map(required => required.label)
            if (missingAssets.length > 0) {
              throw new Error(`Draft release is missing required assets: ${missingAssets.join(', ')}`)
            }

            const manifestAsset = assets.find(asset => asset.name === 'latest.json')
            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner,
              repo,
              asset_id: manifestAsset.id,
              headers: { accept: 'application/octet-stream' }
            })
            const manifestText = Buffer.from(response.data).toString('utf8')
            let manifest
            try {
              manifest = JSON.parse(manifestText)
            } catch (error) {
              throw new Error(`latest.json is not valid JSON: ${error.message}`)
            }

            if (manifest.version !== expectedVersion) {
              throw new Error(`latest.json version ${manifest.version} does not match ${expectedVersion}`)
            }
            const platformEntry = Object.entries(manifest.platforms || {}).find(([platformKey]) =>
              platformKey.includes('darwin') && platformKey.includes('aarch64')
            )
            if (!platformEntry) {
              throw new Error('latest.json has no darwin/aarch64 platform entry')
            }
            const [, platform] = platformEntry
            if (typeof platform.url !== 'string' || !platform.url || !platform.url.endsWith('.app.tar.gz')) {
              throw new Error('latest.json darwin/aarch64 URL must end with .app.tar.gz')
            }
            if (typeof platform.signature !== 'string' || !platform.signature.trim()) {
              throw new Error('latest.json darwin/aarch64 signature is empty')
            }

            core.info(`Verified ${assets.length} draft assets and latest.json for ${expectedVersion}`)

      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false
            })
            core.info(`Published release: ${data.html_url}`)
