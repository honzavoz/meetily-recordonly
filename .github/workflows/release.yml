name: "Release"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Require default branch release
        shell: bash
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$CURRENT_BRANCH" != "$DEFAULT_BRANCH" || "$DEFAULT_BRANCH" != "main" ]]; then
            echo "Releases are allowed only from the default main branch" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version consistency
        run: ./scripts/check-version-consistency.sh

      - name: Validate updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/check-updater-signing-secrets.sh

      - name: Validate release version and tag
        id: get-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use strict X.Y.Z format; got: $VERSION" >&2
            exit 1
          fi

          git fetch --tags
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Release tag v${VERSION} already exists. Bump the application version first." >&2
            exit 1
          fi

          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find or Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const tag = `v${{ steps.get-version.outputs.version }}`
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            })
            const matching = releases.filter(release => release.tag_name === tag)
            if (matching.length > 1) {
              throw new Error(`Multiple releases exist for ${tag}; refusing ambiguous retry`)
            }

            let matchingRelease = matching[0]
            if (matchingRelease) {
              if (!matchingRelease.draft) {
                throw new Error(`Release ${tag} already exists and is not a draft`)
              }
              const { data: updatedDraft } = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: matchingRelease.id,
                target_commitish: context.sha
              })
              matchingRelease = updatedDraft
              const staleAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: matchingRelease.id,
                per_page: 100
              })
              for (const asset of staleAssets) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })
              }
              core.info(`Reusing draft ${matchingRelease.id}; cleared ${staleAssets.length} stale assets`)
            } else {
              const { data } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Meetily v${{ steps.get-version.outputs.version }}`,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              })
              matchingRelease = data
              core.info(`Created draft release with ID: ${data.id}`)
            }
            return matchingRelease.id

  build-macos-apple-silicon:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-14"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin"
      sign-binaries: false
      asset-prefix: "meetily"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      source-ref: ${{ github.sha }}
      deployment-environment: "release"

  verify-and-publish:
    needs: [create-release, build-macos-apple-silicon]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify draft release assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          EXPECTED_VERSION: ${{ needs.create-release.outputs.version }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID)
            const expectedVersion = process.env.EXPECTED_VERSION
            const owner = context.repo.owner
            const repo = context.repo.repo
            const expectedTag = `v${expectedVersion}`
            const { verifyUpdaterReleaseAssets } = require('./scripts/verify-updater-release-assets.js')
            const fs = require('node:fs')
            const path = require('node:path')

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId
            })
            if (!release.draft) {
              throw new Error('Release must remain a draft until verification succeeds')
            }
            if (release.tag_name !== expectedTag) {
              throw new Error(`Draft release tag ${release.tag_name} does not match ${expectedTag}`)
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100
            })
            const manifestAsset = assets.find(asset => asset.name === 'latest.json')
            const signatureAsset = assets.find(asset => asset.name.endsWith('.app.tar.gz.sig'))
            const downloadBytes = async asset => {
              if (!asset) return Buffer.alloc(0)
              const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner,
                repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' }
              })
              return Buffer.from(response.data)
            }
            const [manifestBytes, signatureBytes] = await Promise.all([
              downloadBytes(manifestAsset),
              downloadBytes(signatureAsset)
            ])
            const verified = verifyUpdaterReleaseAssets({
              assets,
              manifestText: manifestBytes.toString('utf8'),
              signatureText: signatureBytes.toString('utf8'),
              expectedVersion,
              expectedOwner: owner,
              expectedRepo: repo,
              expectedTag
            })

            const [archiveBytes, verifiedSignatureBytes] = await Promise.all([
              downloadBytes(verified.archive),
              downloadBytes(verified.signature)
            ])
            const verificationDirectory = path.join(process.env.RUNNER_TEMP, 'updater-verification')
            fs.mkdirSync(verificationDirectory, { recursive: true, mode: 0o700 })
            fs.writeFileSync(path.join(verificationDirectory, 'updater.app.tar.gz'), archiveBytes, { mode: 0o600 })
            fs.writeFileSync(path.join(verificationDirectory, 'updater.app.tar.gz.sig'), verifiedSignatureBytes, { mode: 0o600 })

            core.info(`Verified ${assets.length} draft assets and latest.json for ${expectedVersion}`)

      - name: Install minisign verifier
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
          command -v minisign >/dev/null
          dpkg-query -W -f='Installed minisign version: ${Version}\n' minisign

      - name: Extract configured updater public key
        shell: bash
        run: |
          ./scripts/extract-updater-public-key.js \
            frontend/src-tauri/tauri.conf.json \
            "$RUNNER_TEMP/updater-verification/updater.pub"

      - name: Decode updater minisign signature
        shell: bash
        run: |
          ./scripts/decode-updater-signature.js \
            "$RUNNER_TEMP/updater-verification/updater.app.tar.gz.sig" \
            "$RUNNER_TEMP/updater-verification/updater.app.tar.gz.minisig"

      - name: Cryptographically verify updater archive
        shell: bash
        run: |
          minisign -Vm "$RUNNER_TEMP/updater-verification/updater.app.tar.gz" \
            -x "$RUNNER_TEMP/updater-verification/updater.app.tar.gz.minisig" \
            -p "$RUNNER_TEMP/updater-verification/updater.pub"

      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false
            })
            core.info(`Published release: ${data.html_url}`)
